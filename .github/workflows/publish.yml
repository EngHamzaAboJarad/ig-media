name: Publish to Instagram

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check the token (no publishing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ig-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish due posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node scripts/publish.mjs
      - name: Save status
        if: always()
        run: |
          if ! git diff --quiet schedule.json; then
            git config user.name "ig-bot"
            git config user.email "ig-bot@users.noreply.github.com"
            git commit -am "Update publish status [skip ci]"
            git pull --rebase -q && git push -q
          fi
