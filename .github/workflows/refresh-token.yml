name: Refresh Instagram token

on:
  schedule:
    - cron: "0 6 */7 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh long-lived token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" | jq -r .access_token)
          [ -n "$NEW" ] && [ "$NEW" != "null" ] || { echo "Refresh failed"; exit 1; }
          echo "::add-mask::$NEW"
          if [ -n "$GH_TOKEN" ]; then
            gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
            echo "Token refreshed and saved"
          else
            echo "Token refreshed (expiry extended). Add GH_PAT secret to also save a changed token."
          fi
